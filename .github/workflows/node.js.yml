# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
name: Node.js CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    # - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    - name: Construir imagen
      run: docker build -t calculadora-phishing .
    - name: Probar que responde
      run: |
        docker run -d --name app -p 3000:3000 calculadora-phishing
        curl --fail --retry 15 --retry-delay 1 --retry-all-errors http://localhost:3000
    - name: Mostrar logs
      if: failure()
      run: docker logs app

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Iniciar sesión en Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Generar nombre y etiquetas de la imagen
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: katerinapenaloza7/calculadora-phishing
        tags: |
          type=sha
          type=raw,value=latest
    - name: Construir y publicar
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}